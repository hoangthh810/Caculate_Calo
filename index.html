<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tính Calo Giảm Cân</title>
<style>
  :root { --bg:#f5f7f4; --card:#fff; --text:#1f2a24; --muted:#6b7a71; --accent:#2f8f5b; --accent-soft:#e3f3ea; --bad:#c94a3a; --line:#e2e8e4; }
  @media (prefers-color-scheme: dark) { :root { --bg:#141a17; --card:#1d2521; --text:#e6ece8; --muted:#93a39a; --accent:#5cc28a; --accent-soft:#22372b; --bad:#f07a6a; --line:#2d3832; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width:900px; margin:0 auto; padding:16px; }
  h1 { font-size:24px; margin:8px 0 16px; }
  h2 { font-size:18px; margin:0 0 12px; }
  h3 { font-size:15px; margin:12px 0 6px; }
  section { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:16px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(140px, 1fr)); gap:10px; }
  label { display:flex; flex-direction:column; font-size:13px; color:var(--muted); gap:4px; }
  input, select, button { font:inherit; color:var(--text); background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:8px 10px; }
  button { cursor:pointer; }
  button.primary { background:var(--accent); color:#fff; border:0; font-weight:600; }
  .row { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
  .row input { flex:1; min-width:160px; }
  .stats { display:grid; grid-template-columns:repeat(auto-fit, minmax(120px, 1fr)); gap:10px; margin-top:12px; }
  .stats div { background:var(--bg); border-radius:10px; padding:10px; text-align:center; }
  .stats b { display:block; font-size:22px; }
  .stats span { font-size:12px; color:var(--muted); }
  .stats .hl { background:var(--accent-soft); color:var(--accent); }
  .stats .bad { background:var(--accent-soft); color:var(--bad); }
  .bar { height:10px; background:var(--bg); border-radius:5px; overflow:hidden; margin-top:10px; }
  .bar i { display:block; height:100%; background:var(--accent); }
  .bar i.over { background:var(--bad); }
  .warn { color:var(--bad); }
  .muted { color:var(--muted); }
  .err { color:var(--bad); font-size:13px; min-height:1em; margin:6px 0 0; }
  ul { list-style:none; padding:0; margin:12px 0 0; }
  li { display:flex; justify-content:space-between; gap:8px; padding:6px 0; border-bottom:1px solid var(--line); }
  .x { padding:0 6px; border:0; background:none; color:var(--muted); }
  fieldset { border:1px solid var(--line); border-radius:10px; margin:0 0 10px; padding:8px 10px; }
  legend { font-weight:600; padding:0 4px; }
  .chip { display:inline-flex; flex-direction:row; align-items:center; gap:4px; margin:3px; padding:4px 10px; border:1px solid var(--line); border-radius:999px; color:var(--text); font-size:13px; background:var(--bg); }
  .chip small, .day small { color:var(--muted); }
  .chip.add { border-style:dashed; color:var(--accent); }
  .days { display:grid; grid-template-columns:repeat(auto-fit, minmax(250px, 1fr)); gap:10px; }
  .day { background:var(--bg); border-radius:10px; padding:4px 12px 8px; }
  .day p { margin:4px 0; font-size:13px; }
</style>
</head>
<body>
<main>
  <h1>🥗 Tính Calo Giảm Cân</h1>

  <section>
    <h2>1. Thông tin &amp; mục tiêu</h2>
    <form id="profileForm">
      <div class="grid">
        <label>Giới tính <select id="sex"><option value="m">Nam</option><option value="f">Nữ</option></select></label>
        <label>Cân nặng hiện tại (kg) <input id="weight" type="number" step="0.1" min="30" max="300" required></label>
        <label>Chiều cao (cm) <input id="height" type="number" min="120" max="230" required></label>
        <label>Tuổi <input id="age" type="number" min="12" max="100" required></label>
        <label>Mức vận động
          <select id="activity">
            <option value="1.2">Ít vận động</option>
            <option value="1.375">Nhẹ (1-3 buổi/tuần)</option>
            <option value="1.55">Vừa (3-5 buổi/tuần)</option>
            <option value="1.725">Nhiều (6-7 buổi/tuần)</option>
          </select>
        </label>
        <label>Muốn giảm (kg) <input id="loseKg" type="number" step="0.1" min="0.1" max="100" required></label>
        <label>Trong bao nhiêu ngày <input id="days" type="number" min="1" max="1000" required></label>
      </div>
      <div class="row"><button class="primary" type="submit">Tính calo</button></div>
    </form>
    <div id="goalOut"></div>
  </section>

  <section>
    <h2>2. Hôm nay đã ăn</h2>
    <form id="logForm" class="row">
      <input id="entry" list="foodNames" placeholder='Ví dụ: 100g cơm, ức gà 150' autocomplete="off" aria-label="Món đã ăn">
      <button class="primary" type="submit">Thêm</button>
    </form>
    <datalist id="foodNames"></datalist>
    <p id="entryErr" class="err" role="alert"></p>
    <div id="logSummary"></div>
    <ul id="logList"></ul>
  </section>

  <section>
    <h2>3. Món tôi mua / ăn được</h2>
    <p class="muted">Tick các món bạn có thể mua hoặc thích ăn (số nhỏ = kcal/100g). Thực đơn tuần sẽ dùng các món này.</p>
    <div id="foodGrid"></div>
    <form id="customForm" class="row">
      <input id="cName" placeholder="Tên món mới" required aria-label="Tên món mới">
      <input id="cKcal" type="number" min="0" step="1" placeholder="kcal / 100g" required aria-label="kcal trên 100g" style="max-width:130px">
      <select id="cCat" aria-label="Nhóm món">
        <option value="carb">Tinh bột</option><option value="protein">Đạm</option><option value="veg">Rau</option>
        <option value="fruit">Trái cây / bữa phụ</option><option value="other">Món khác</option>
      </select>
      <button type="submit">+ Thêm món</button>
    </form>
  </section>

  <section>
    <h2>4. Thực đơn tuần tham khảo</h2>
    <div class="row" style="margin:0 0 10px"><button id="regen" type="button">🔄 Đổi thực đơn khác</button></div>
    <div id="menu" class="days"></div>
    <div id="suggest"></div>
  </section>
</main>
<script src="app.js"></script>
</body>
</html>
